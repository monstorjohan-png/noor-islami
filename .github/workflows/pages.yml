# النشر على GitHub Pages — الرابط الحيّ الدائم المجاني
# ------------------------------------------------------------------
# هذا هو مسار النشر الفعلي. لا يحتاج حساباً في أي جهة خارجية.
#
# البوابة (`quality.yml`) تُستدعى كوظيفة قابلة لإعادة الاستخدام، فلا
# توجد نسخة ثانية من الفحوص هنا. أي فشل في البوابة يوقف النشر.
#
# الرابط: https://<صاحب-المستودع>.github.io/<اسم-المستودع>/

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # بوابة الجودة — مصدر واحد للحقيقة، يعمل قبل البناء المنشور
  gate:
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # المحتوى الديني خارج git — يُجلب ويُشظّى في كل تشغيل
      - name: جلب المحتوى وتشظيئه
        run: npm run data

      # Pages يقدّم المشروع تحت /<repo>/ فالبناء يحتاج هذا الأساس
      - name: البناء على مسار المستودع
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - name: التأكد من وجود رؤوس الأمان
        run: |
          test -f dist/_headers || { echo "::error::dist/_headers مفقود"; exit 1; }
          grep -q "Content-Security-Policy" dist/_headers || { echo "::error::سياسة الأمان غير موجودة"; exit 1; }

      # Pages لا يقرأ `_redirects`، فتردّ كل صفحة داخلية بخطأ ٤٠٤.
      # نسخ `index.html` باسم `404.html` يجعل Pages يخدم التطبيق كما يخدمه
      # Cloudflare عبر `_redirects`. مصدر واحد للتوجيه، مخرجان.
      - name: Fallback للمسارات الداخلية
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
