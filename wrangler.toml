# إعدادات Cloudflare Pages
# ------------------------------------------------------------------
#-pages.dev نطاق مجاني دائم، لا تنتهي صلاحيته ما دام المشروع معلماً.
# التوزيع على شبكة Cloudflare العالمية بلا حدّ للزيارات.
#
# النشر الآلي عبر `.github/workflows/deploy.yml` — لا حاجة لنشر يدوي.
# النشر اليدوي، إن أردت يوماً:
#   npx wrangler pages deploy dist --project-name=noor-islami

name = "noor"
compatibility_date = "2026-09-28"
pages_build_output_dir = "dist"

# متغيّرات بناء اختيارية.
# مفاتيح المصادقة تُمرَّر من أسرار GitHub لا من هنا، فتُكتب في المتغيّرات
# عند إنشاء المشروع على Cloudflare لا في هذا الملف.
[vars]
# مزامنة العلامات مغلقة افتراضياً. تُفتح بعلم VITE_SYNC=1
# مع ضبط مفاتيح المصادقة في أسرار النشر.
